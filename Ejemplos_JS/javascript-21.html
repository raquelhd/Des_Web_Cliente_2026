<!DOCTYPE html>
<html lang="es-ES">
   <head>
       <title>DOM</title>
       <meta charset="utf-8">
       <style>
          .azul { color: blue; }
          .verde { color: green; }
          .negrita { font-weight: bold; }
       </style>    
   </head>
   <body>
       <p id="p1" lang="lat" >Lorem ipsum dolor sit amet, consectetur 
       adipisicing elit. <span id="pepe">Ut enim ad 
       minim veniam</span>, quis nostrud exercitation.
       </p>

       <p class="clase1">Lorem ipsum dolor sit amet, consectetur 
       et dolore magna aliqua.
       </p>

       <p class="clase1">Excepteur sint occaecat cupidatat non
       proident, <span><b>Lorem ipsum</b></span> dolor sit amet.
       </p>

       <script>
         // Cambiar ATRIBUTOS (id) y CLASES CSS de un elemento.
         var spResaltado = document.getElementById("resaltado");
         spResaltado.id = "pepe";                          // cambiamos su id

         var spResaltado = document.getElementById("resaltado"); // ya se puede localizar por el id nuevo
         console.log(spResaltado);                          // muestra el <span> en la consola

         spResaltado.className="azul";                // className SUSTITUYE todas las clases por "azul"
         spResaltado.classList.add("negrita");        // classList permite trabajar clase a clase: añade
         spResaltado.classList.remove("azul");        // quita
         spResaltado.classList.toggle("negrita");     // toggle: si está la quita -> ahora no está
         spResaltado.classList.toggle("negrita");     // ...y si no está la pone -> vuelve a estar (queda en negrita)
       </script>
   </body>
</html>
